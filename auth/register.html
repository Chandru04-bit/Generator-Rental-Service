<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account – Customer Portal | PowerRent</title>
  <meta name="description" content="Create a PowerRent enterprise customer account to reserve generators, manage rental agreements, and download invoices.">
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo/favicon.svg">

  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Minimal auth navbar -->
  <nav class="navbar navbar-expand-xl powerrent-navbar auth-navbar">
    <div class="container">
      <a class="navbar-brand" href="../index.html">
        <img src="../assets/images/logo/logo.svg" alt="PowerRent Logo" width="180" height="38">
      </a>
      <div class="nav-controls ms-auto">
        <button class="control-btn theme-toggle-btn" type="button" title="Toggle Dark/Light Mode" aria-label="Toggle Dark/Light Mode">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <button class="control-btn dir-toggle-btn control-btn-badge" type="button" title="Toggle Text Direction" aria-label="Toggle Text Direction"><span class="dir-label">RTL</span>
        </button>
        <a class="btn btn-sm btn-pr-outline auth-dashboard-btn" href="../customer/dashboard.html">
          <i class="bi bi-speedometer2 me-1"></i><span class="dash-btn-text">Dashboard</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- REGISTER CONTENT -->
  <main class="section-padding my-auto">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <div class="form-card">
            <div class="text-center mb-4">
              <h3 class="fw-bold text-navy mb-1">Create Customer Account</h3>
              <p class="text-muted small">Register for online reservations, telemetry access, and billing management</p>
            </div>

            <div id="register-alert-area"></div>

            <form id="customer-register-form" novalidate>
              <div class="row g-3 mb-3">
                <div class="col-12">
                  <label class="form-label" for="reg-name">Full Name or Company Representative *</label>
                  <input type="text" class="form-control" id="reg-name" placeholder="John Doe" autocomplete="name" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="reg-email">Email Address *</label>
                  <input type="email" class="form-control" id="reg-email" placeholder="Enter your email address" autocomplete="email" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="reg-phone">Phone Number *</label>
                  <input type="tel" class="form-control" id="reg-phone" placeholder="+1 (555) 234-5678" autocomplete="tel" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="reg-password">Create Password *</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="reg-password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
                    <button class="btn btn-outline-secondary password-toggle-btn" type="button" aria-label="Show password"><i class="bi bi-eye"></i></button>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="reg-confirm-password">Confirm Password *</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="reg-confirm-password" placeholder="Confirm your password" autocomplete="new-password" minlength="8" required>
                    <button class="btn btn-outline-secondary password-toggle-btn" type="button" aria-label="Show password"><i class="bi bi-eye"></i></button>
                  </div>
                </div>
                <div class="col-12">
                  <div class="form-check mt-2">
                    <input class="form-check-input" type="checkbox" id="reg-terms" required>
                    <label class="form-check-label small" for="reg-terms">
                      I have read and agree to the PowerRent <a href="../pages/faq.html" class="text-accent">Rental Terms & Conditions</a> and <a href="#" class="text-accent">Privacy Policy</a>.
                    </label>
                  </div>
                </div>
              </div>

              <button type="submit" class="btn btn-pr-primary register-submit-button fw-bold mb-3 shadow">
                <i class="bi bi-person-check-fill"></i><span class="register-submit-label">Create Customer Account</span>
              </button>

              <div class="text-center small text-muted">
                Already have an account? <a href="login.html" class="fw-bold text-accent">Sign in here</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  
  <script src="../assets/js/direction.js"></script>
  <script src="../assets/js/generator.js"></script>
  <script src="../assets/js/authentication.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
