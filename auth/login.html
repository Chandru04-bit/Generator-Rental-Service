<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login Portal | PowerRent</title>
  <meta name="description" content="Log in to your PowerRent customer portal to track active generator rentals, download invoices, and manage service agreements.">
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo/favicon.svg">

  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Global Header & Navbar -->
  <nav class="navbar navbar-expand-xl powerrent-navbar">
    <div class="container">
      <a class="navbar-brand" href="../index.html">
        <img src="../assets/images/logo/logo.svg" alt="PowerRent Logo" width="180" height="38">
      </a>
      <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#powerrentNavContent">
        <i class="bi bi-list fs-1 text-accent"></i>
      </button>

      <div class="collapse navbar-collapse" id="powerrentNavContent">
        <ul class="navbar-nav mx-auto mb-2 mb-xl-0">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Home</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="../index.html"><i class="bi bi-house-door me-2"></i>Home 1 – Industrial Main</a></li>
              <li><a class="dropdown-item" href="../home-2.html"><i class="bi bi-building me-2"></i>Home 2 – Commercial & Events</a></li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link" href="../pages/about.html">About Us</a></li>
          
          <li class="nav-item"><a class="nav-link" href="../pages/services.html">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="../pages/pricing.html">Pricing</a></li>
          <li class="nav-item"><a class="nav-link" href="../pages/contact.html">Contact</a></li>
          <li class="nav-item" id="nav-dashboard-item" style="display: none;">
            <a class="nav-link text-warning fw-bold" href="../customer/dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
          </li>
        </ul>

        <div class="nav-controls">
          <button class="control-btn theme-toggle-btn" type="button" title="Toggle Theme"><i class="bi bi-moon-stars-fill"></i></button>
          <button class="control-btn dir-toggle-btn control-btn-badge" type="button" title="Toggle Direction"><i class="bi bi-arrow-left-right me-1"></i><span class="dir-label">RTL</span></button>
          <div id="nav-auth-item">
            <a href="login.html" class="btn btn-sm btn-pr-outline active"><i class="bi bi-box-arrow-in-right me-1"></i>Login</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- LOGIN CONTENT AREA -->
  <main class="section-padding my-auto">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8">
          <div class="form-card" id="login-form-wrapper">
            <div class="text-center mb-4">
              <div class="stat-icon mx-auto mb-3"><i class="bi bi-person-lock"></i></div>
              <h3 class="fw-bold text-navy mb-1">Customer Portal Login</h3>
              <p class="text-muted small">Access your bookings, fuel reports, and digital invoices</p>
            </div>

            <!-- In-page Alert Area (updated upon successful login per Section 17 rules) -->
            <div id="login-alert-area"></div>

            <form id="customer-login-form" novalidate>
              <div class="mb-3">
                <label class="form-label" for="login-email">Corporate / Work Email Address *</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="login-email" placeholder="john.doe@enterprise.com" required value="john.doe@enterprise.com">
                </div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label class="form-label mb-0" for="login-password">Password *</label>
                  <a href="forgot-password.html" class="small text-accent text-decoration-none">Forgot Password?</a>
                </div>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                  <input type="password" class="form-control" id="login-password" placeholder="••••••••" required value="password123">
                  <button class="btn btn-outline-secondary password-toggle-btn" type="button" title="Show/Hide Password">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <div class="mb-4 d-flex justify-content-between align-items-center">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="login-remember" checked>
                  <label class="form-check-label small" for="login-remember">Remember My Session</label>
                </div>
              </div>

              <button type="submit" class="btn btn-pr-primary btn-lg w-100 fw-bold mb-3 shadow">
                <i class="bi bi-box-arrow-in-right me-1"></i>Sign In to Account
              </button>

              <div class="text-center small text-muted">
                Don't have a registered account yet? <a href="register.html" class="fw-bold text-accent">Create Account</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  
  <script src="../assets/js/direction.js"></script>
  <script src="../assets/js/generator.js"></script>
  <script src="../assets/js/authentication.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
