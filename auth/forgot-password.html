<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – Reset Access | PowerRent</title>
  <meta name="description" content="Reset your PowerRent customer portal password.">
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo/favicon.svg">

  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Global Header & Navbar -->
  <nav class="navbar navbar-expand-xl powerrent-navbar">
    <div class="container">
      <a class="navbar-brand" href="../index.html">
        <img src="../assets/images/logo/logo.svg" alt="PowerRent Logo" width="180" height="38">
      </a>
      <div class="ms-auto d-flex gap-2">
        <button class="control-btn theme-toggle-btn" type="button" title="Toggle Theme"><i class="bi bi-moon-stars-fill"></i></button>
        <button class="control-btn dir-toggle-btn control-btn-badge" type="button" title="Toggle Direction"><i class="bi bi-arrow-left-right me-1"></i><span class="dir-label">RTL</span></button>
        <a href="login.html" class="btn btn-sm btn-pr-outline"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
      </div>
    </div>
  </nav>

  <!-- FORGOT PASSWORD CONTENT -->
  <main class="section-padding my-auto">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8">
          <div class="form-card">
            <div class="text-center mb-4">
              <div class="stat-icon mx-auto mb-3"><i class="bi bi-key"></i></div>
              <h3 class="fw-bold text-navy mb-1">Reset Password</h3>
              <p class="text-muted small">Enter your account email and we'll send password reset instructions</p>
            </div>

            <div id="forgot-alert-area"></div>

            <form id="customer-forgot-form" novalidate>
              <div class="mb-4">
                <label class="form-label" for="forgot-email">Registered Email Address *</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="forgot-email" placeholder="john.doe@enterprise.com" required value="john.doe@enterprise.com">
                </div>
              </div>

              <button type="submit" class="btn btn-pr-primary btn-lg w-100 fw-bold mb-3 shadow">
                <i class="bi bi-send-fill me-1"></i>Send Reset Link
              </button>

              <div class="text-center small text-muted">
                Remember your password? <a href="login.html" class="fw-bold text-accent">Sign in here</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  
  <script src="../assets/js/direction.js"></script>
  <script src="../assets/js/authentication.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
