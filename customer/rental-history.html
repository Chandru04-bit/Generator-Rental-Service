<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>

  <link rel="icon" type="image/svg+xml" href="../assets/images/logo/favicon.svg">

  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">

  <div class="dashboard-layout">

      </div>

      <div class="dashboard-user-card">

          <div class="dash-user-role text-truncate dash-user-email-display">Not Signed In</div>
        </div>
      </div>

      <ul class="dash-nav">
        <li class="dash-nav-item">
          <a href="dashboard.html" class="dash-nav-link">
            <i class="bi bi-speedometer2"></i>

          </a>
        </li>
        <li class="dash-nav-item">
          <a href="my-bookings.html" class="dash-nav-link">
            <i class="bi bi-calendar-check"></i>
            <span>My Bookings</span>
          </a>
        </li>
        <li class="dash-nav-item">
          <a href="active-rentals.html" class="dash-nav-link">
            <i class="bi bi-broadcast-pin"></i>
            <span>Active Rentals</span>
          </a>
        </li>
        <li class="dash-nav-item">
          <a href="rental-history.html" class="dash-nav-link active">
            <i class="bi bi-clock-history"></i>
            <span>Rental History</span>
          </a>
        </li>
        <li class="dash-nav-item">
          <a href="invoices.html" class="dash-nav-link">

            <span>Invoices</span>
          </a>
        </li>
        <li class="dash-nav-item">
          <a href="profile.html" class="dash-nav-link">
            <i class="bi bi-person-gear"></i>

          </a>
        </li>
      </ul>

      <div class="dash-sidebar-footer">
        <a href="../index.html" class="btn btn-sm btn-outline-light w-100 mb-2">
          <i class="bi bi-arrow-left me-1"></i>Return to Website
        </a>
        <button class="btn btn-sm btn-danger w-100" id="dash-sidebar-logout">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>
      </div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <h1 class="dashboard-page-title">Completed Rental History</h1>
        <div class="dashboard-topbar-actions">

          <button class="control-btn dir-toggle-btn control-btn-badge" type="button" title="Toggle Direction"><i class="bi bi-arrow-left-right me-1"></i><span class="dir-label">RTL</span></button>

      <div class="dashboard-content">

          <div class="dash-panel-header">
            <h5 class="dash-panel-title">Archived Equipment Deployments</h5>
            <span class="small text-muted">Complete records of returned equipment and settled invoices</span>
          </div>
          
          <div id="rental-history-list-container">
            <!-- Populated by dashboard.js -->
          </div>

  <script src="../assets/js/direction.js"></script>
