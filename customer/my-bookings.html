<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings – Customer Portal | PowerRent</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo/favicon.svg">

  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="dashboard-sidebar">
      <div class="dashboard-brand">
        <a href="../index.html">
          <img src="../assets/images/logo/logo.svg" alt="PowerRent Logo" width="160" height="34">
        </a>
      </div>

      <div class="dashboard-user-card">
        <img src="../assets/images/testimonials/client-1.jpg" alt="User Avatar" class="dash-avatar">
        <div class="overflow-hidden">
          <div class="dash-user-name text-truncate dash-user-name-display">Guest User</div>
          <div class="dash-user-role text-truncate dash-user-email-display">Not Signed In</div>
        </div>
      </div>

      <ul class="dash-nav">
        <li class="dash-nav-item">
          <a href="dashboard.html" class="dash-nav-link">
            <i class="bi bi-speedometer2"></i>
            <span>Overview</span>
          </a>
        </li>
        <li class="dash-nav-item">
          <a href="my-bookings.html" class="dash-nav-link active">
            <i class="bi bi-calendar-check"></i>
            <span>My Bookings</span>
          </a>
        </li>
        <li class="dash-nav-item">
          <a href="active-rentals.html" class="dash-nav-link">
            <i class="bi bi-broadcast-pin"></i>
            <span>Active Rentals</span>
          </a>
        </li>
        <li class="dash-nav-item">
          <a href="rental-history.html" class="dash-nav-link">
            <i class="bi bi-clock-history"></i>
            <span>Rental History</span>
          </a>
        </li>
        <li class="dash-nav-item">
          <a href="invoices.html" class="dash-nav-link">
            <i class="bi bi-receipt"></i>
            <span>Invoices</span>
          </a>
        </li>
        <li class="dash-nav-item">
          <a href="profile.html" class="dash-nav-link">
            <i class="bi bi-person-gear"></i>
            <span>My Profile</span>
          </a>
        </li>
      </ul>

      <div class="dash-sidebar-footer">
        <a href="../index.html" class="btn btn-sm btn-outline-light w-100 mb-2">
          <i class="bi bi-arrow-left me-1"></i>Return to Website
        </a>
        <button class="btn btn-sm btn-danger w-100" id="dash-sidebar-logout">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <h1 class="dashboard-page-title">My Generator Bookings</h1>
        <div class="dashboard-topbar-actions">
          <button class="control-btn theme-toggle-btn" type="button" title="Toggle Theme"><i class="bi bi-moon-stars-fill"></i></button>
          <button class="control-btn dir-toggle-btn control-btn-badge" type="button" title="Toggle Direction"><i class="bi bi-arrow-left-right me-1"></i><span class="dir-label">RTL</span></button>
          <a href="../pages/booking.html" class="btn btn-sm btn-pr-primary"><i class="bi bi-plus-lg me-1"></i>Book Generator</a>
        </div>
      </header>

      <div class="dashboard-content">
        <!-- Search & Status Filter Controls -->
        <div class="dash-panel p-3 mb-4">
          <div class="row g-3 align-items-center">
            <div class="col-md-5">
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                <input type="text" id="booking-search-input" class="form-control" placeholder="Search by booking reference or generator...">
              </div>
            </div>
            <div class="col-md-7 text-md-end">
              <div class="btn-group" role="group">
                <button type="button" class="btn btn-sm btn-outline-dark booking-filter-btn active" data-status="all">All Bookings</button>
                <button type="button" class="btn btn-sm btn-outline-dark booking-filter-btn" data-status="active">Active</button>
                <button type="button" class="btn btn-sm btn-outline-dark booking-filter-btn" data-status="confirmed">Confirmed</button>
                <button type="button" class="btn btn-sm btn-outline-dark booking-filter-btn" data-status="completed">Completed</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Bookings List Container -->
        <div id="my-bookings-list-container">
          <!-- Dynamically populated by dashboard.js -->
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  
  <script src="../assets/js/direction.js"></script>
  <script src="../assets/js/generator.js"></script>
  <script src="../assets/js/authentication.js"></script>
  <script src="../assets/js/dashboard.js"></script>
</body>
</html>
