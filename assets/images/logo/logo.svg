<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <!-- Generator Emblem Shield -->
  <g transform="translate(4, 3)">
    <rect x="0" y="2" width="40" height="40" rx="8" fill="url(#shieldGrad)" stroke="#F59E0B" stroke-width="2.5"/>
    <!-- Turbine Lines / Cog details -->
    <circle cx="20" cy="22" r="14" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 2"/>
    <!-- High Energy Lightning Bolt -->
    <path d="M22 8 L13 23 L19 23 L17 36 L27 21 L21 21 Z" fill="url(#boltGrad)" filter="drop-shadow(0 2px 4px rgba(245,158,11,0.5))"/>
  </g>
  <!-- Brand Text -->
  <text x="54" y="29" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" letter-spacing="1">
    <tspan fill="#FFFFFF">POWER</tspan><tspan fill="#F59E0B">RENT</tspan>
  </text>
  <text x="55" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8" fill="#94A3B8" letter-spacing="2">
    GENERATOR RENTAL SERVICE
  </text>
</svg>
